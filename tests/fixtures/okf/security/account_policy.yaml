# 企业账号管理制度

## 1. 总则

企业信息系统账号必须按照统一规范进行管理。所有员工必须使用企业分配的唯一账号。

## 2. 离职账号管理

员工离职后，应在3个工作日内关闭相关账号。部门主管负责提交账号注销申请。

## 3. 账号安全要求

密码必须包含大小写字母、数字和特殊字符，长度不少于12位。每90天必须更换密码。
