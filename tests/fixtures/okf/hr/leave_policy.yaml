# 员工休假管理制度

## 1. 年假

正式员工入职满一年后享有年假。年假天数根据工龄计算：1-5年为5天，5-10年为10天，10年以上为15天。

## 2. 病假

员工因病需要休假时，应提供正规医疗机构出具的诊断证明。病假期间工资按照国家规定发放。

## 3. 事假

事假需提前申请，每次不超过3天。事假期间不发放工资。
